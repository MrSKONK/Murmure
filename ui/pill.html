<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Murmure — pastille</title>
<!-- Pastille de la version 2 (Tauri) : onde vocale, minuteur et croix d'annulation ; au-dessus, une bulle où le
     texte provisoire apparaît mot à mot pendant qu'on parle. Fenêtre transparente, qui ne prend jamais le focus. -->
<style>
  :root { --bg: #16161c; --border: #34343e; --text: #eeeef6; --muted: #9696a8; --red: #ff5460; --info: #6e96ff; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default;
               font: 600 13.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 1px; }

  /* bulle du texte en direct */
  .bubble { box-sizing: border-box; width: 520px; max-height: 0; padding: 0 16px; overflow: hidden;
            background: rgba(22, 22, 28, .94); border: 1px solid var(--border); border-radius: 16px; opacity: 0;
            color: var(--text); font: 500 14.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
            transform: translateY(6px); transition: opacity .2s ease, transform .25s ease, max-height .25s ease, padding .25s ease; }
  .bubble.show { max-height: 86px; padding: 9px 16px; opacity: 1; transform: none; }
  .bubble.final { color: var(--muted); }
  .lines { max-height: 66px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .lines.clip { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22px); mask-image: linear-gradient(to bottom, transparent, #000 22px); }
  .w { display: inline; }
  .w.new { animation: appear .28s ease-out both; }
  @keyframes appear { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
  .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -2px; border-radius: 1px;
           background: #b9a9ff; animation: blink 1s steps(2, start) infinite; }
  .bubble.final .caret { display: none; }
  @keyframes blink { to { visibility: hidden; } }

  /* pastille */
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 54px; box-sizing: border-box; padding: 0 9px 0 16px;
          background: var(--bg); border: 1px solid var(--border); border-radius: 27px; color: var(--text); white-space: nowrap;
          opacity: 0; transform: translateY(10px) scale(.96); transition: opacity .18s ease, transform .22s cubic-bezier(.2,.9,.3,1.2); }
  .pill.show { opacity: 1; transform: none; }
  .pill > * { flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); position: relative; margin-right: 2px; }
  .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--red); opacity: .25;
                animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.55); opacity: 0; } }
  canvas { width: 132px; height: 36px; }
  .timer { font: 500 12.5px "Segoe UI", system-ui, sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 30px; }
  .close { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.09); color: #cdcdda;
           display: grid; place-items: center; cursor: pointer; transition: background .12s; }
  .close:hover { background: #e2505c; color: #fff; }
  .close svg { width: 11px; height: 11px; }
  .dots { display: flex; gap: 5px; align-items: center; height: 20px; margin-right: 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; animation: hop 1s ease-in-out infinite; }
  .dots i:nth-child(1) { background: #8b7cff; } .dots i:nth-child(2) { background: #a877e6; animation-delay: .12s; }
  .dots i:nth-child(3) { background: #c573d3; animation-delay: .24s; } .dots i:nth-child(4) { background: #e270c2; animation-delay: .36s; }
  .dots i:nth-child(5) { background: #ff6fb1; animation-delay: .48s; }
  @keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-7px); } }
  .badge { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; background: var(--info); }
  .badge.error { background: var(--red); }
  .msg { max-width: 420px; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .processing .msg { padding-right: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bubble" id="bubble"><div class="lines" id="lines"><div id="inner"><span id="words"></span><span class="caret"></span></div></div></div>
  <div class="pill" id="pill">
    <span class="dot" id="dot"></span>
    <canvas id="wave" width="264" height="72"></canvas>
    <span class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="badge" id="badge"></span>
    <span class="msg" id="msg"></span>
    <span class="timer" id="timer">0:00</span>
    <button class="close" id="close" title="Annuler (Échap)">
      <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const tauri = window.__TAURI__;
const BARS = 24;
let state = "hidden", startedAt = 0, levels = new Array(BARS).fill(0), lastPoll = 0, polling = false, raf = 0;

function show(id, on) { $(id).hidden = !on; }

// ---- taille de la fenêtre : celle de la pastille, plus la bulle quand elle est visible ----
let sized = "";
function resize() {
  requestAnimationFrame(() => {
    const bubble = $("bubble").classList.contains("show");
    const width = Math.ceil(Math.max($("pill").scrollWidth, bubble ? 520 : 0)) + 4;
    const height = 56 + (bubble ? 94 : 0);
    if (sized === `${width}x${height}`) return;
    sized = `${width}x${height}`;
    tauri.core.invoke("pill_resize", { width, height }).catch(() => {});
  });
}

// ---- texte en direct : les mots nouveaux apparaissent un à un, ceux que Whisper corrige sont remplacés ----
let shown = [], queue = [], revealTimer = 0;

function setBubble(on) {
  const b = $("bubble");
  if (b.classList.contains("show") === on) return;
  b.classList.toggle("show", on);
  resize();
}

function clearWords() {
  shown = []; queue = []; clearTimeout(revealTimer); revealTimer = 0;
  $("words").replaceChildren();
  $("bubble").classList.remove("final");
  setBubble(false);
}

function addWord(word, animate) {
  const span = document.createElement("span");
  span.className = animate ? "w new" : "w";
  span.textContent = (shown.length ? " " : "") + word;
  $("words").append(span);
  shown.push(word);
  const lines = $("lines");
  lines.classList.toggle("clip", $("inner").offsetHeight > lines.clientHeight + 2);
}

function revealNext() {
  revealTimer = 0;
  if (!queue.length) return;
  addWord(queue.shift(), true);
  // rattrape le retard : plus il reste de mots, plus ils arrivent vite (entre 25 et 85 ms)
  if (queue.length) revealTimer = setTimeout(revealNext, Math.max(25, Math.min(85, 520 / queue.length)));
}

function setLiveText(text) {
  const words = text.split(/\s+/).filter(Boolean);
  if (!words.length) return;
  setBubble(true);
  const target = shown.concat(queue);
  let common = 0;
  while (common < words.length && common < target.length && words[common] === target[common]) common++;
  if (common < shown.length) {   // Whisper a revu la fin : on remplace ces mots sans animation
    const spans = $("words").children;
    while (shown.length > common) { spans[spans.length - 1].remove(); shown.pop(); }
  }
  queue = words.slice(shown.length);
  if (!revealTimer) revealNext();
}

// ---- états ----
function setState(next, text) {
  const pill = $("pill");
  if (next === "hidden") {
    pill.classList.remove("show"); setBubble(false); state = next; stopWave();
    setTimeout(() => { if (state === "hidden") clearWords(); }, 260);
    return;
  }
  if (next === "recording" && state !== "recording") {
    startedAt = performance.now(); levels.fill(0); clearWords();
  }
  if (next === "processing") {   // le texte provisoire reste visible, grisé, pendant la transcription finale
    queue.forEach((w) => addWord(w, false)); queue = [];
    $("bubble").classList.add("final");
  }
  if (next === "notice" || next === "error") clearWords();
  state = next;
  pill.className = "pill show " + next;
  const rec = next === "recording", proc = next === "processing", note = next === "notice" || next === "error";
  show("dot", rec); show("wave", rec); show("timer", rec); show("dots", proc);
  show("close", rec || proc); show("badge", note); show("msg", proc || note);
  $("badge").textContent = next === "error" ? "!" : "i";
  $("badge").className = "badge" + (next === "error" ? " error" : "");
  $("msg").textContent = text || (proc ? "Transcription…" : "");
  if (rec) startWave(); else stopWave();
  resize();
}

// ---- onde du micro ----
function drawWave() {
  const c = $("wave"), g = c.getContext("2d"), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  const pitch = w / BARS, bw = pitch * 0.46;
  for (let i = 0; i < BARS; i++) {
    const v = Math.max(0, Math.min(1, levels[i]));
    const bh = Math.max(bw, 8 + (h - 12) * v);
    const t = i / (BARS - 1);
    const r = Math.round(0x8b + (0xff - 0x8b) * t), gr = Math.round(0x7c + (0x6f - 0x7c) * t), b = Math.round(0xff + (0xb1 - 0xff) * t);
    g.fillStyle = `rgb(${r},${gr},${b})`;
    const x = i * pitch + (pitch - bw) / 2, y = (h - bh) / 2;
    g.beginPath(); g.roundRect(x, y, bw, bh, bw / 2); g.fill();
  }
}

function frame(now) {
  if (state !== "recording") return;
  const s = Math.floor((now - startedAt) / 1000);
  $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  if (!polling && now - lastPoll > 45) {
    polling = true; lastPoll = now;
    tauri.core.invoke("pill_level").then((rms) => {
      levels.shift(); levels.push(Math.min(1, Math.sqrt(rms) * 2.4));
    }).catch(() => {}).finally(() => { polling = false; });
  }
  drawWave();
  raf = requestAnimationFrame(frame);
}
function startWave() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
function stopWave() { cancelAnimationFrame(raf); }

$("close").addEventListener("click", () => tauri.core.invoke("cancel_dictation"));
tauri.event.listen("pill", (e) => setState(e.payload.state, e.payload.text));
tauri.event.listen("preview", (e) => { if (state === "recording") setLiveText(String(e.payload || "")); });
</script>
</body>
</html>
