name: Build Windows

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Tests
        run: python -m unittest discover tests

      - name: Construction de Murmure.exe
        run: python -m PyInstaller --noconfirm --clean packaging/murmure.spec

      - name: Autotest de l'exécutable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "check.txt"
          $p = Start-Process dist/Murmure/Murmure.exe -ArgumentList "--check", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Murmure-windows
          path: dist/Murmure
